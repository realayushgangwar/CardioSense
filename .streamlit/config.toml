[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
borderColor = "#CBD5E1"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
primaryColor = "#3B82F6"
backgroundColor = "#0F294A"
secondaryBackgroundColor = "#1E3A5F"
textColor = "#F8FAFC"
borderColor = "#334155"

